<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Liberation Sans, Arial, sans-serif">
  <rect width="1000" height="560" fill="#f4f7f9"/>
  <text x="30" y="42" font-size="24" font-weight="bold" fill="#071a2b">Arquitectura del portal EEST N°3</text>
  <text x="30" y="66" font-size="13" fill="#5d6b78">Frontend estático, funciones serverless y Supabase como backend gestionado</text>

  <rect x="30" y="95" width="280" height="200" rx="14" fill="#ffffff" stroke="#087fa5" stroke-width="2"/>
  <text x="48" y="124" font-size="16" font-weight="bold" fill="#087fa5">FRONTEND</text>
  <text x="48" y="150" font-size="13" fill="#1f2d3a">HTML · CSS · módulos ES</text>
  <text x="48" y="172" font-size="13" fill="#1f2d3a">CMS público y editor</text>
  <text x="48" y="194" font-size="13" fill="#1f2d3a">Comunidad, buscador, calendario</text>
  <text x="48" y="216" font-size="13" fill="#1f2d3a">PWA · service worker · offline</text>
  <text x="48" y="238" font-size="13" fill="#1f2d3a">Accesibilidad y tema claro/oscuro</text>
  <text x="48" y="270" font-size="12" fill="#5d6b78">Netlify CDN · HTTPS · headers</text>

  <rect x="360" y="95" width="280" height="200" rx="14" fill="#071a2b"/>
  <text x="378" y="124" font-size="16" font-weight="bold" fill="#7fe0f5">NETLIFY</text>
  <text x="378" y="150" font-size="13" fill="#ffffff">Functions y tareas programadas</text>
  <text x="378" y="172" font-size="13" fill="#ffffff">contacto · respuesta · bajas</text>
  <text x="378" y="194" font-size="13" fill="#ffffff">procesar-correo · webhook</text>
  <text x="378" y="216" font-size="13" fill="#ffffff">feed.xml · calendario.ics</text>
  <text x="378" y="238" font-size="13" fill="#ffffff">backup-diario · health</text>
  <text x="378" y="270" font-size="12" fill="#b8d5e2">Build: npm test &amp;&amp; npm run build</text>

  <rect x="690" y="95" width="280" height="200" rx="14" fill="#ffffff" stroke="#2f8f5b" stroke-width="2"/>
  <text x="708" y="124" font-size="16" font-weight="bold" fill="#2f8f5b">SUPABASE</text>
  <text x="708" y="150" font-size="13" fill="#1f2d3a">Auth · MFA TOTP · sesiones</text>
  <text x="708" y="172" font-size="13" fill="#1f2d3a">PostgreSQL · RLS · RPC</text>
  <text x="708" y="194" font-size="13" fill="#1f2d3a">Storage privado y público</text>
  <text x="708" y="216" font-size="13" fill="#1f2d3a">Búsqueda · métricas · cola</text>
  <text x="708" y="238" font-size="13" fill="#1f2d3a">Auditoría y trazabilidad</text>
  <text x="708" y="270" font-size="12" fill="#5d6b78">Migraciones incrementales 1–18</text>

  <rect x="30" y="345" width="940" height="80" rx="12" fill="#e8f1f6" stroke="#b8d5e2"/>
  <text x="48" y="372" font-size="15" font-weight="bold" fill="#071a2b">Flujo editorial</text>
  <text x="48" y="396" font-size="12" fill="#1f2d3a">Editor guarda borrador → revisor aprueba/rechaza → administración publica → CMS público aplica la versión publicada.</text>
  <text x="48" y="414" font-size="12" fill="#1f2d3a">Cada acción queda en cms_revisions con autor, rol, fecha y nota; la publicación registra approved_by y published_by.</text>

  <rect x="30" y="445" width="940" height="85" rx="12" fill="#ffffff" stroke="#d8e2ea"/>
  <text x="48" y="472" font-size="15" font-weight="bold" fill="#071a2b">Calidad y operación</text>
  <text x="48" y="496" font-size="12" fill="#1f2d3a">141 pruebas · PGlite para RLS/RPC · contratos HTML · auditoría de accesibilidad · build aislado en dist/.</text>
  <text x="48" y="516" font-size="12" fill="#1f2d3a">GitHub Actions → Netlify · backups diarios · monitoreo de cola · webhook de rebotes · documentación y releases semánticas.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#087fa5"/>
    </marker>
  </defs>
  <line x1="310" y1="195" x2="355" y2="195" stroke="#087fa5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="195" x2="685" y2="195" stroke="#2f8f5b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="318" y="185" font-size="11" fill="#087fa5">HTTPS / JSON</text>
  <text x="646" y="185" font-size="11" fill="#2f8f5b">REST / RPC / Auth</text>
</svg>
