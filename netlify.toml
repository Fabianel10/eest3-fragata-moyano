[build]
  publish = "dist"
  command = "npm test && npm run build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[build.processing]
  skip_processing = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
